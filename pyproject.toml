[project]
name = "agent"
version = "0.1.0"
description = "Modular, local-first hybrid personal AI agent"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Shaun", email = "shaun@example.com"}]
keywords = ["ai", "agent", "assistant", "pydantic", "asyncio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
desktop = [
    "PySide6>=6.8",
]
packaging = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.entry-points.console_scripts]
agent-loop = "agent.cli:main_sync"
agent-desktop = "agent.desktop_app:main"
agent-web = "agent.web.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
